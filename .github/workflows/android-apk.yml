name: Build NOVA Client APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip -q nova-source.zip -d source

      - name: Build APK
        working-directory: source/NOVA_Client_Overlay_Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-CLIENT-APK
          path: source/NOVA_Client_Overlay_Android/app/build/outputs/apk/debug/app-debug.apk
